<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L’Oréal Smart Product Advisor</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="brand-bar"></div>

    <div class="page-wrapper">
      <!-- Header / Branding -->
      <header class="site-header">
        <div class="brand-lockup">
          <img src="loreal.png" alt="L'Oréal" class="brand-logo" />
          <div class="brand-text">
            <h1 class="site-title">L’Oréal Smart Product Advisor</h1>
            <p class="site-subtitle">Ask about L’Oréal products, routines, and recommendations.</p>
          </div>
        </div>
      </header>

      <!-- Chat Area -->
      <main>
        <section class="chatbox card">
          <div class="card-title">
            <span class="dot"></span> Chat
          </div>

          <div id="chatWindow" class="chat-window" aria-live="polite"></div>

          <!-- Requirement: show last question above response -->
          <div id="lastQuestion" class="last-question" aria-live="polite"></div>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask about L’Oréal products or routines…"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn" title="Send" class="btn">
              <span class="material-icons">send</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>
      </main>

      <!-- Footer -->
      <footer class="site-footer">
        <p>&copy; 2025 L’Oréal (student project). This demo answers only L’Oréal-related questions.</p>
        <nav>
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Contact</a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
